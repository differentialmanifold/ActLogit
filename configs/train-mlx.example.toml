[model]
backend = "mlx"
name_or_path = "./models/your-mlx-model"
# Optional input budget; omit to use the model context limit.
# max_prompt_tokens = 8192

[lora]
rank = 16
alpha = 32
dropout = 0.0
target_modules = "all-linear"
# Set num_layers to train only the final N blocks; omit to train all blocks.

[training]
data = "examples/train.jsonl"
eval_data = "examples/eval.jsonl"
output_dir = "outputs/domain-adapter"
epochs = 3
batch_size = 1
gradient_accumulation_steps = 8
learning_rate = 0.0001
seed = 42

# Qwen3.5 only; validate on your model before enabling.
mlx_chunked_gated_delta = false
mlx_fast_frozen_prefix = false
mlx_batching = false
mlx_clear_cache_interval = 25
