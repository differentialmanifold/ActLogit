[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "actlogit"
version = "0.1.0"
description = "Local Choice, Noul and Score inference with offline Forward KL + LoRA fine-tuning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["llm", "lora", "mlx", "classification", "distillation"]
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.31.3,<0.32"]
eval = [
  "huggingface-hub>=0.34,<2",
  "pyarrow>=19,<24",
  "absl-py>=2,<3",
  "langdetect==1.0.9",
  "nltk==3.9.2",
  "immutabledict>=4,<5",
  "psutil>=6,<8",
]
local = [
  "torch>=2.5,<3",
  "transformers>=4.51,<6",
  "peft>=0.15,<1",
  "accelerate>=1.2,<2",
  "safetensors>=0.5",
]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11"]

[project.scripts]
actlogit = "actlogit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/actlogit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/actlogit/regression/_ifeval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
